[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskkit"
version = "0.1.0"
description = "Gemeinsames Grundgeruest fuer die *desk-Apps (moviedesk, comicdesk, ...)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.6",
]

[project.urls]
Homepage = "https://github.com/aaaaaprvdgrwwelt/deskkit"

[tool.setuptools.packages.find]
include = ["deskkit*"]
