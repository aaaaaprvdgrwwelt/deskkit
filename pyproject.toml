[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskkit"
version = "0.1.0"
description = "Gemeinsames Grundgeruest fuer die *desk-Apps (moviedesk, comicdesk, ...)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.11.2",
]

[project.urls]
Homepage = "https://github.com/aaaaaprvdgrwwelt/deskkit"

[tool.setuptools.packages.find]
include = ["deskkit*"]

[tool.ruff]
target-version = "py310"
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = [
    "E501",  # Zeilenlaenge wird von Hand umgebrochen, nicht erzwungen
    "B008",  # QModelIndex() als Vorgabewert ist die uebliche Qt-Modell-Signatur
]
